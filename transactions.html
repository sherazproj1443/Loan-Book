*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}

.nav a.active{background:var(--text);color:#000}
.nav-row a.active{background:var(--text);color:#000}
.status-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:11px}

.card.debit{border-left:4px solid var(--red)}.card.credit{border-left:4px solid var(--green)}.card.balance{border-left:4px solid var(--yellow)}.card.blue{border-left:4px solid var(--blue)}
.label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.value{font-size:22px;font-weight:800;word-break:break-all}

.btn-primary{background:var(--text);color:#000}.btn-debit{background:var(--red);color:#fff}.btn-credit{background:var(--green);color:#000}.btn-blue{background:var(--blue);color:#fff}.btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:50;padding:12px}
.modal-bg.open{display:grid}.modal{width:100%;max-width:360px;background:#1a201c;border:1px solid #2a352e;border-radius:18px;padding:16px;max-height:90vh;overflow:auto}
.field{margin-bottom:10px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:#121512;border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;outline:none}

.actions{display:flex;gap:6px;margin-top:8px}
.btn-sm{border:1px solid var(--border);background:var(--card2);color:var(--text);padding:5px 9px;border-radius:8px;font-size:10px;cursor:pointer}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.setup-card input{width:100%;background:#121512;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:11px;margin-top:6px}

</div>
<div class="status-bar"><span id="statusText">Loading...</span><span id="syncText" style="font-size:10px;color:var(--muted)"></span></div>

<div class="chip-row">
<button class="chip active" onclick="setFilter('all',this)">All</button>
<button class="chip" onclick="setFilter('credit',this)">Diya</button>
<button class="chip" onclick="setFilter('debit',this)">Liya</button>
<button class="chip" onclick="setFilter('pending',this)">Pending</button>
<button class="chip" onclick="setFilter('paid',this)">Paid</button>
</div>

<div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveLoan()">Save</button></div>
</div></div>

<script type="module">
import { JSONBIN_CONFIG } from './jsonbin-config.js';
let CONFIG=JSONBIN_CONFIG; const s=localStorage.getItem('jsonbin_config'); if(s){try{const j=JSON.parse(s); if(j.BIN_ID!='YOUR_BIN_ID') CONFIG=j;}catch(e){}}
let data={loans:[], incomes:[], expenses:[]}; let filter='all'; let editId=null;

function getProfilesForSettle(){
 const map={};
 data.loans.forEach(t=>{
  const key = (t.name||'').trim().toLowerCase();
  if(!key) return;
  if(!map[key]){
   map[key]={key, totalCredit:0, totalDebit:0, countPending:0, entries:[], paidLoans:[]};
  }
  if(t.status!=='paid'){
   map[key].countPending++;
   if(t.type==='credit') map[key].totalCredit+=+t.amount;
   else map[key].totalDebit+=+t.amount;
  } else {
   map[key].paidLoans.push(t);
  }
  map[key].entries.push(t);
 });
 const repaymentCats=['loan_return','credit_card','loan_repayment'];
 Object.values(map).forEach(profile=>{
  let allRepayments=[];
  data.expenses.forEach(exp=>{
   const cat=(exp.category||'').toLowerCase();
   const isRepay = repaymentCats.includes(cat) || cat.includes('loan') || cat.includes('return');
   if(!isRepay) return;
   const note=(exp.note||'').toLowerCase();
   if(note.includes(profile.key)){
    allRepayments.push({amount:+exp.amount, _matched:false});
   }
  });
  data.incomes.forEach(inc=>{
   const src=(inc.source||'').toLowerCase();
   const isLoanRepay = src.includes('loan') && (src.includes('repay') || src.includes('return'));
   if(!isLoanRepay) return;
   const note=(inc.note||'').toLowerCase();
   if(note.includes(profile.key)){
    allRepayments.push({amount:+inc.amount, _matched:false});
   }
  });
  // match repayments to paid loans to exclude
  profile.paidLoans.forEach(pl=>{
   const idx = allRepayments.findIndex(r=> !r._matched && Math.abs(r.amount - +pl.amount) < 0.01);
   if(idx!==-1) allRepayments[idx]._matched = true;
  });
  const unmatched = allRepayments.filter(r=>!r._matched);
  const totalRepaid = unmatched.reduce((s,x)=>s+ x.amount,0);
  profile.totalRepaid=totalRepaid;
  profile.net = profile.totalCredit - profile.totalDebit;
  if(profile.net>0) profile.adjustedNet = profile.net - totalRepaid;
  else if(profile.net<0) profile.adjustedNet = profile.net + totalRepaid;
  else profile.adjustedNet = profile.net;
 });
 return Object.values(map);
}


async function autoSettleIfNeeded(){
 const profiles = getProfilesForSettle();
 let settled=0;
 profiles.forEach(p=>{
  if(p.adjustedNet===0 && p.countPending>0){
   data.loans.forEach(loan=>{
    if((loan.name||'').trim().toLowerCase()===p.key && loan.status!=='paid'){
     loan.status='paid';
     settled++;
    }
   });
  }
 });
 if(settled>0){
  await save();
  return settled;
 }
 return 0;
}

async function load(){
 try{
  const res=await fetch(CONFIG.API_URL+'/'+CONFIG.BIN_ID+'/latest',{headers:{'X-Master-Key':CONFIG.API_KEY}});
  const j=await res.json(); const rec=j.record;
  data.loans=rec.loans||[]; data.incomes=rec.incomes||[]; data.expenses=rec.expenses||[];
  if(Array.isArray(rec)) data.loans=rec;
  const settled = await autoSettleIfNeeded();
  render();
  document.getElementById('statusText').textContent='Online • '+data.loans.length + (settled? ' • '+settled+' auto-paid':'');
  if(settled>0){
   document.getElementById('syncText').textContent=settled+' loans auto marked paid (net zero)';
  }
 }catch(e){
  const local=localStorage.getItem('loanbook_v2_full');
  if(local){ try{ data=JSON.parse(local); }catch{} }
  render();
  document.getElementById('statusText').textContent='Offline • Local';
 }
}
async function save(){localStorage.setItem('loanbook_v2_full', JSON.stringify(data));
  if(!navigator.onLine){ localStorage.setItem('fintrack_pending_sync','true'); } try{await fetch(CONFIG.API_URL+'/'+CONFIG.BIN_ID,{method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':CONFIG.API_KEY}, body:JSON.stringify(data)});}catch(e){}}

window.fmt=(n)=>'Rs '+Number(n).toLocaleString('en-PK');
window.render=()=>{
 const q=document.getElementById('search').value.toLowerCase();
 let list=data.loans.filter(x=>{
  if(q && !x.name.toLowerCase().includes(q)) return false;
  if(filter==='all') return true;
  if(filter==='credit' || filter==='debit') return x.type===filter;
  return x.status===filter;
 });
 document.getElementById('listWrap').innerHTML = list.map(r=>`
 <div class="row" style="flex-direction:column;align-items:stretch">
  <div style="display:flex;justify-content:space-between"><b>${r.name}</b><b>${fmt(r.amount)}</b></div>
  <div style="font-size:11px;color:var(--muted);margin-top:4px"><span class="badge ${r.type}">${r.type==='credit'?'DIYA':'LIYA'}</span> <span class="badge ${r.status==='paid'?'credit':'expense'}">${r.status}</span> ${r.date} • ${r.note||''}</div>
  <div class="actions"><button class="btn-sm" onclick="editLoan('${r.id}')">Edit</button><button class="btn-sm" onclick="togglePaid('${r.id}')">${r.status==='paid'?'Undo':'Paid'}</button><button class="btn-sm" style="color:var(--red)" onclick="delLoan('${r.id}')">Delete</button></div>
 </div>
 `).join('') || '<div style="text-align:center;color:var(--muted);padding:20px">No loans</div>';
}

window.setFilter=(f,el)=>{filter=f; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); render();}

window.openModal=()=>{editId=null; document.getElementById('modalTitle').textContent='Add Loan'; document.getElementById('loanName').value=''; document.getElementById('loanAmount').value=''; document.getElementById('loanDate').valueAsDate=new Date(); document.getElementById('loanNote').value=''; document.getElementById('modalBg').classList.add('open');}
window.closeModal=()=>document.getElementById('modalBg').classList.remove('open');

window.editLoan=(id)=>{
 const r=data.loans.find(x=>String(x.id)===String(id)); if(!r) return;
 editId=id;
 document.getElementById('modalTitle').textContent='Edit Loan';
 document.getElementById('loanType').value=r.type;
 document.getElementById('loanName').value=r.name;
 document.getElementById('loanAmount').value=r.amount;
 document.getElementById('loanDate').value=r.date;
 document.getElementById('loanStatus').value=r.status;
 document.getElementById('loanNote').value=r.note||'';
 document.getElementById('modalBg').classList.add('open');
}

window.saveLoan=async()=>{
 const name=document.getElementById('loanName').value.trim();
 const amount=parseFloat(document.getElementById('loanAmount').value);
 const date=document.getElementById('loanDate').value;
 const type=document.getElementById('loanType').value;
 const status=document.getElementById('loanStatus').value;
 const note=document.getElementById('loanNote').value.trim();
 if(!name||!amount){alert('Name/Amount required'); return;}
 if(editId){const r=data.loans.find(x=>String(x.id)===String(editId)); if(r){r.name=name; r.amount=amount; r.date=date||new Date().toISOString().slice(0,10); r.type=type; r.status=status; r.note=note;}}
 else{data.loans.unshift({id:Date.now(), name, amount, date:date||new Date().toISOString().slice(0,10), note, type, status});}
 closeModal(); await save(); const settled = await autoSettleIfNeeded(); render(); if(settled>0){ await save(); render(); }
}

window.delLoan=async(id)=>{if(!confirm('Delete?')) return; data.loans=data.loans.filter(x=>String(x.id)!==String(id)); render(); await save();}
window.togglePaid=async(id)=>{const r=data.loans.find(x=>String(x.id)===String(id)); if(r){r.status=r.status==='paid'?'pending':'paid'; render(); await save();}}
document.getElementById('search').addEventListener('input',render);
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg') closeModal();});
load();
</script>

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
