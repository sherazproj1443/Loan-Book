<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135707.png">
<title>LoanBook - JSONBin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1210;--card:#171c19;--card2:#1e2521;--border:#242e27;--text:#e8efe9;--muted:#8da090;--green:#1ed760;--red:#ff4d4d;--yellow:#ffb020}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
html,body{overflow-x:hidden;width:100%}body{background:var(--bg);color:var(--text);min-height:100vh}
.container{width:100%;max-width:390px;margin:0 auto;padding:14px 12px 110px}
.topbar{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-weight:800;font-size:22px;text-align:center;width:100%}.logo span{color:var(--green)}
.nav{width:100%;display:flex;gap:6px;background:var(--card);padding:5px;border-radius:999px;border:1px solid var(--border)}
.nav a{flex:1;text-align:center;padding:9px 6px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:12px}
.nav a.active{background:var(--text);color:#000}
.status-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:11px}
.totals{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.total-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.total-card .label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.total-card .value{font-size:24px;font-weight:800}
.total-card.debit{border-left:4px solid var(--red)}.total-card.credit{border-left:4px solid var(--green)}.total-card.balance{border-left:4px solid var(--yellow)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.list{display:flex;flex-direction:column;gap:8px}
.person-row{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);padding:10px 12px;border-radius:12px}
.avatar{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px}
.btn{border:none;cursor:pointer;font-weight:700;border-radius:12px;padding:12px 10px;font-size:12px;display:flex;justify-content:center;flex:1}
.btn-primary{background:var(--text);color:#000}.btn-debit{background:var(--red);color:#fff}.btn-credit{background:var(--green);color:#000}.btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:50;padding:12px}
.modal-bg.open{display:grid}.modal{width:100%;max-width:360px;background:#1a201c;border:1px solid #2a352e;border-radius:18px;padding:16px}
.field{margin-bottom:10px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:5px}
.field input,.field textarea{width:100%;background:#121512;border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.setup-card input{width:100%;background:#121512;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:11px;margin-top:6px}
.type-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#121512;padding:4px;border-radius:10px;margin-bottom:14px}
.type-switch button{padding:9px;border-radius:8px;background:transparent;color:var(--muted);font-weight:700;border:1px solid transparent}
.type-switch button.active-debit{background:rgba(255,77,77,.12);color:var(--red)}.type-switch button.active-credit{background:rgba(30,215,96,.12);color:var(--green)}
</style>
</head>
<body>
<div class="container">
<div class="topbar"><div class="logo">Loan<span>Book</span> - JSONBin</div><div class="nav"><a href="index.html" class="active">Home</a><a href="transactions.html">Transactions</a><a href="profiles.html">Profiles</a></div></div>
<div class="status-bar"><span id="statusText">Setup required</span><span id="syncText" style="font-size:10px;color:#8da090">--</span></div>
<div class="setup-card" id="setupCard">
<h3>Setup (1 dafa)</h3>
<p>jsonbin.io pe Bin banao content {"loans":[]}</p>
<input id="binIdInput" placeholder="BIN_ID"><input id="apiKeyInput" placeholder="X-Master-Key" style="margin-top:8px">
<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="saveConfig()">Save & Connect</button>
</div>
<div class="totals">
<div class="total-card credit"><div class="label">Loan Diya</div><div class="value" id="totalCredit">Rs 0</div><small id="creditCount"></small></div>
<div class="total-card debit"><div class="label">Loan Liya</div><div class="value" id="totalDebit">Rs 0</div><small id="debitCount"></small></div>
<div class="total-card balance"><div class="label">Net</div><div class="value" id="netBalance">Rs 0</div><small id="balanceMsg"></small></div>
</div>
<div class="panel"><h3 style="font-size:13px;margin-bottom:8px">Top Debtors</h3><div class="list" id="topCreditors"></div></div>
<div class="panel" style="margin-top:10px"><h3 style="font-size:13px;margin-bottom:8px">Top Creditors</h3><div class="list" id="topDebitors"></div></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-debit" onclick="openModal('debit')">+ Liya</button><button class="btn btn-credit" onclick="openModal('credit')">+ Diya</button></div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal"><h2 id="modalTitle">Add</h2><div class="type-switch"><button id="btnDebit" onclick="setType('debit')">Liya</button><button id="btnCredit" onclick="setType('credit')">Diya</button></div><div class="field"><label>Name</label><input id="pName"></div><div class="field"><label>Amount</label><input id="pAmount" type="number"></div><div class="field"><label>Date</label><input id="pDate" type="date"></div><div class="field"><label>Note</label><textarea id="pNote"></textarea></div><div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveTx()">Save</button></div></div></div>
<script type="module">
import { JSONBIN_CONFIG } from './jsonbin-config.js';
let CONFIG = JSONBIN_CONFIG;
let loans=[];let currentType='credit';
const saved=localStorage.getItem('jsonbin_config');
if(saved){try{const s=JSON.parse(saved);if(s.BIN_ID!='YOUR_BIN_ID')CONFIG=s;}catch(e){}}
function isConfigured(){return CONFIG.BIN_ID!='YOUR_BIN_ID';}
async function loadData(){
 if(!isConfigured()){document.getElementById('statusText').textContent='BIN_ID dalo';return;}
 document.getElementById('statusText').textContent='Loading...';
 try{
  const res=await fetch(CONFIG.API_URL+'/'+CONFIG.BIN_ID+'/latest',{headers:{'X-Master-Key':CONFIG.API_KEY}});
  const j=await res.json(); loans=j.record.loans||j.record||[]; if(!Array.isArray(loans))loans=j.record.loans||[];
  document.getElementById('statusText').textContent='Online '+loans.length; document.getElementById('setupCard').style.display='none'; renderHome();
 }catch(e){const local=localStorage.getItem('loanbook_v2'); if(local){loans=JSON.parse(local); renderHome();}}
}
async function saveData(){localStorage.setItem('loanbook_v2',JSON.stringify(loans)); if(!isConfigured())return; await fetch(CONFIG.API_URL+'/'+CONFIG.BIN_ID,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':CONFIG.API_KEY},body:JSON.stringify({loans})});}
window.saveConfig=()=>{const b=document.getElementById('binIdInput').value.trim();const k=document.getElementById('apiKeyInput').value.trim();if(!b||!k){alert('bharo');return}CONFIG={BIN_ID:b,API_KEY:k,API_URL:'https://api.jsonbin.io/v3/b'};localStorage.setItem('jsonbin_config',JSON.stringify(CONFIG));document.getElementById('setupCard').style.display='none';loadData();}
window.fmt=(n)=>'Rs '+Number(n).toLocaleString('en-PK');
window.renderHome=()=>{
 let d=0,c=0;const mc={},md={};
 loans.filter(t=>t.status!='paid').forEach(t=>{if(t.type=='debit'){d+=+t.amount;md[t.name]=(md[t.name]||0)+ +t.amount}else{c+=+t.amount;mc[t.name]=(mc[t.name]||0)+ +t.amount}});
 document.getElementById('totalDebit').textContent=fmt(d);document.getElementById('totalCredit').textContent=fmt(c);
 document.getElementById('netBalance').textContent=fmt(c-d);
 const rc=Object.entries(mc).sort((a,b)=>b[1]-a[1]).slice(0,5); const rd=Object.entries(md).sort((a,b)=>b[1]-a[1]).slice(0,5);
 document.getElementById('topCreditors').innerHTML=rc.map(([n,a])=>`<div class=person-row><b>${n}</b><span>${fmt(a)}</span></div>`).join('')||'empty';
 document.getElementById('topDebitors').innerHTML=rd.map(([n,a])=>`<div class=person-row><b>${n}</b><span>${fmt(a)}</span></div>`).join('')||'empty';
}
window.openModal=(t)=>{currentType=t;setType(t);document.getElementById('pDate').valueAsDate=new Date();document.getElementById('modalBg').classList.add('open');}
window.closeModal=()=>document.getElementById('modalBg').classList.remove('open');
window.setType=(t)=>{currentType=t;document.getElementById('btnDebit').className=t=='debit'?'active-debit':'';document.getElementById('btnCredit').className=t=='credit'?'active-credit':'';}
window.saveTx=async()=>{const name=document.getElementById('pName').value.trim();const amount=parseFloat(document.getElementById('pAmount').value);const date=document.getElementById('pDate').value;const note=document.getElementById('pNote').value.trim();if(!name||!amount){alert('fill');return}loans.unshift({id:Date.now(),name,amount,date:date||new Date().toISOString().slice(0,10),note,type:currentType,status:'pending'});closeModal();renderHome();await saveData();document.getElementById('pName').value='';document.getElementById('pAmount').value='';}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id=='modalBg')closeModal();});
loadData();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
