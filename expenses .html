<!DOCTYPE html>
<html lang="en"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#0f1210">
<title>Expenses Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1210;--card:#171c19;--card2:#1e2521;--border:#242e27;--text:#e8efe9;--muted:#8da090;--green:#1ed760;--green-bg:rgba(30,215,96,.12);--red:#ff4d4d;--red-bg:rgba(255,77,77,.12);--yellow:#ffb020;--blue:#4da3ff;--blue-bg:rgba(77,163,255,.12)}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
html,body{overflow-x:hidden;width:100%}body{background:var(--bg);color:var(--text);min-height:100vh}
.container{width:100%;max-width:390px;margin:0 auto;padding:14px 12px 110px}
.topbar{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-weight:800;font-size:20px;text-align:center;width:100%}.logo span{color:var(--green)}
.nav{width:100%;display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;border:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:1;white-space:nowrap;text-align:center;padding:8px 6px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:11px}
.nav a.active{background:var(--text);color:#000}
.status-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:11px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.card.debit{border-left:4px solid var(--red)}.card.credit{border-left:4px solid var(--green)}.card.balance{border-left:4px solid var(--yellow)}.card.blue{border-left:4px solid var(--blue)}
.label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.value{font-size:22px;font-weight:800;word-break:break-all}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.small{font-size:11px;color:var(--muted);margin-top:4px}
.btn{border:none;cursor:pointer;font-weight:700;border-radius:12px;padding:11px 10px;font-size:11px;display:flex;justify-content:center;align-items:center;flex:1}
.btn-primary{background:var(--text);color:#000}.btn-debit{background:var(--red);color:#fff}.btn-credit{background:var(--green);color:#000}.btn-blue{background:var(--blue);color:#fff}.btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:50;padding:12px}
.modal-bg.open{display:grid}.modal{width:100%;max-width:360px;background:#1a201c;border:1px solid #2a352e;border-radius:18px;padding:16px;max-height:90vh;overflow:auto}
.field{margin-bottom:10px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:#121512;border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;outline:none}
.chip-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.chip-row::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:11px;font-weight:700;flex-shrink:0;cursor:pointer}
.chip.active{background:var(--text);color:#000}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.badge{font-size:9px;padding:3px 7px;border-radius:6px;font-weight:800}
.badge.credit{background:rgba(30,215,96,.15);color:var(--green)}.badge.debit{background:rgba(255,77,77,.15);color:var(--red)}.badge.expense{background:rgba(255,176,32,.15);color:var(--yellow)}.badge.income{background:rgba(77,163,255,.15);color:var(--blue)}
.actions{display:flex;gap:6px;margin-top:8px}
.btn-sm{border:1px solid var(--border);background:var(--card2);color:var(--text);padding:5px 9px;border-radius:8px;font-size:10px;cursor:pointer}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.setup-card input{width:100%;background:#121512;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:11px;margin-top:6px}
.type-switch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#121512;padding:4px;border-radius:10px;margin-bottom:12px}
.type-switch button{padding:8px;border-radius:8px;background:transparent;color:var(--muted);font-weight:700;border:1px solid transparent;font-size:11px}
.type-switch button.active{background:var(--text);color:#000}
</style></head>
<body>
<div class="container">
<div class="topbar"><div class="logo">Loan<span>Book</span> v2</div>
<div class="nav"><a href="index.html">Dashboard</a><a href="transactions.html">Loans</a><a href="incomes.html">Income</a><a href="expenses.html" class="active">Expenses</a><a href="profiles.html">Profiles</a></div></div>
<div class="status-bar"><span id="statusText">Loading...</span></div>

<div class="grid2">
<div class="card expense"><div class="label">Total Expenses</div><div class="value" id="totalExp">Rs 0</div></div>
<div class="card blue"><div class="label">This Month</div><div class="value" id="monthExp">Rs 0</div></div>
</div>

<div class="chip-row" id="catChips">
<button class="chip active" onclick="setCat('all',this)">All</button>
<button class="chip" onclick="setCat('household',this)">Household</button>
<button class="chip" onclick="setCat('grocery',this)">Grocery</button>
<button class="chip" onclick="setCat('clothing',this)">Clothing</button>
<button class="chip" onclick="setCat('cigarette',this)">Cigarette</button>
<button class="chip" onclick="setCat('canteen_duty',this)">Canteen Duty</button>
<button class="chip" onclick="setCat('canteen_barrack',this)">Canteen Barrack</button>
<button class="chip" onclick="setCat('loan_return',this)">Loan Return</button>
<button class="chip" onclick="setCat('credit_card',this)">Credit Card</button>
<button class="chip" onclick="setCat('travel',this)">Travel</button>
<button class="chip" onclick="setCat('committee',this)">Committee</button>
</div>

<input id="search" placeholder="Search note/category..." style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;color:var(--text);margin-bottom:12px">
<div id="listWrap"></div>
<button class="btn btn-blue" style="width:100%;margin-top:12px" onclick="openModal()">+ Add Expense</button>
</div>

<div class="modal-bg" id="modalBg"><div class="modal">
<h2 id="modalTitle">Add / Edit Expense</h2>
<div class="field"><label>Category</label><select id="expCat">
<option value="household">Household</option>
<option value="grocery">Grocery Shopping</option>
<option value="clothing">Clothing Shopping</option>
<option value="cigarette">Cigarette</option>
<option value="canteen_duty">Canteen - Duty</option>
<option value="canteen_barrack">Canteen - Barrack</option>
<option value="loan_return">Loan Return</option>
<option value="credit_card">Credit Card Repayment</option>
<option value="travel">Travel Expenses</option>
<option value="committee">Committee / Daisy (Bina Interest)</option>
<option value="utilities">Utilities</option>
<option value="other">Other</option>
</select></div>
<div class="field"><label>Amount</label><input id="expAmount" type="number"></div>
<div class="field"><label>Date</label><input id="expDate" type="date"></div>
<div class="field"><label>Note</label><textarea id="expNote" placeholder="Kahan kharch kiya?"></textarea></div>
<div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveExp()">Save</button></div>
</div></div>

<script type="module">
import { JSONBIN_CONFIG } from './jsonbin-config.js';
let CONFIG=JSONBIN_CONFIG; const s=localStorage.getItem('jsonbin_config'); if(s){try{const j=JSON.parse(s); if(j.BIN_ID!='YOUR_BIN_ID') CONFIG=j;}catch(e){}}
let data={loans:[], incomes:[], expenses:[]}; let cat='all'; let editId=null;

async function load(){const res=await fetch(CONFIG.API_URL+'/'+CONFIG.BIN_ID+'/latest',{headers:{'X-Master-Key':CONFIG.API_KEY}}); const j=await res.json(); const rec=j.record; data.loans=rec.loans||[]; data.incomes=rec.incomes||[]; data.expenses=rec.expenses||[]; render();}
async function save(){await fetch(CONFIG.API_URL+'/'+CONFIG.BIN_ID,{method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':CONFIG.API_KEY}, body:JSON.stringify(data)}); localStorage.setItem('loanbook_v2_full', JSON.stringify(data));}

window.fmt=(n)=>'Rs '+Number(n).toLocaleString('en-PK');
window.render=()=>{
 const q=document.getElementById('search').value.toLowerCase();
 let list=data.expenses.filter(x=>{
  if(cat!=='all' && x.category!==cat) return false;
  if(q && !((x.note||'').toLowerCase().includes(q) || x.category.includes(q))) return false;
  return true;
 });
 const total=list.reduce((s,x)=>s+ +x.amount,0);
 const monthTotal=data.expenses.filter(x=>{const d=new Date(x.date); const now=new Date(); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();}).reduce((s,x)=>s+ +x.amount,0);
 document.getElementById('totalExp').textContent=fmt(data.expenses.reduce((s,x)=>s+ +x.amount,0));
 document.getElementById('monthExp').textContent=fmt(monthTotal);
 document.getElementById('listWrap').innerHTML=list.map(r=>`
 <div class="row" style="flex-direction:column;align-items:stretch">
  <div style="display:flex;justify-content:space-between"><b style="text-transform:capitalize">${r.category.replace('_',' ')}</b><b>${fmt(r.amount)}</b></div>
  <div style="font-size:11px;color:var(--muted);margin-top:4px">${r.date} • ${r.note||''}</div>
  <div class="actions"><button class="btn-sm" onclick="editExp('${r.id}')">Edit</button><button class="btn-sm" style="color:var(--red)" onclick="delExp('${r.id}')">Delete</button></div>
 </div>
 `).join('') || '<div style="text-align:center;color:var(--muted);padding:20px">No expenses</div>';
}

window.setCat=(c,el)=>{cat=c; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render();}
window.openModal=()=>{editId=null; document.getElementById('modalTitle').textContent='Add Expense'; document.getElementById('expAmount').value=''; document.getElementById('expDate').valueAsDate=new Date(); document.getElementById('expNote').value=''; document.getElementById('modalBg').classList.add('open');}
window.closeModal=()=>document.getElementById('modalBg').classList.remove('open');
window.editExp=(id)=>{
 const r=data.expenses.find(x=>String(x.id)===String(id)); if(!r) return; editId=id;
 document.getElementById('modalTitle').textContent='Edit Expense';
 document.getElementById('expCat').value=r.category;
 document.getElementById('expAmount').value=r.amount;
 document.getElementById('expDate').value=r.date;
 document.getElementById('expNote').value=r.note||'';
 document.getElementById('modalBg').classList.add('open');
}
window.saveExp=async()=>{
 const cat=document.getElementById('expCat').value;
 const amount=parseFloat(document.getElementById('expAmount').value);
 const date=document.getElementById('expDate').value;
 const note=document.getElementById('expNote').value.trim();
 if(!amount){alert('Amount required'); return;}
 if(editId){const r=data.expenses.find(x=>String(x.id)===String(editId)); if(r){r.category=cat; r.amount=amount; r.date=date||new Date().toISOString().slice(0,10); r.note=note;}}
 else{data.expenses.unshift({id:Date.now(), category:cat, amount, date:date||new Date().toISOString().slice(0,10), note});}
 closeModal(); render(); await save();
}
window.delExp=async(id)=>{if(!confirm('Delete?')) return; data.expenses=data.expenses.filter(x=>String(x.id)!==String(id)); render(); await save();}
document.getElementById('search').addEventListener('input',render);
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg') closeModal();});
load();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
